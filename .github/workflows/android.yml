name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ~1 million puzzles are built from scripts/puzzles/*.csv(.gz) instead of being stored twice in git
      - name: Build puzzle library
        run: npx tsx scripts/puzzles/build-puzzles.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit tests (rules, PGN, storage, Stockfish)
        run: npm test

      - name: Verify middlegame/endgame lessons with Stockfish
        run: npx tsx scripts/lessons/check-lessons.ts

      - name: Build web app (fails on any external URL)
        run: npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner ships the Android SDK; just accept its licences.
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "assets/public/(index.html|engine/|pieces/cburnett/wK)"
          unzip -l "$APK" | grep -q "assets/public/engine/stockfish-19-lite-single.wasm"
          # the data the app fetches must be in the APK under the exact names it asks for
          for f in data/puzzles/index.json data/puzzles/ratings.pz data/puzzles/cats.pz data/puzzles/0.pz data/academy/index.json data/academy/sicilian.json data/books/books.pz; do
            unzip -l "$APK" | grep -q "assets/public/$f" || { echo "missing in APK: $f"; exit 1; }
          done
          echo "puzzle chunks in APK: $(unzip -l "$APK" | grep -c 'assets/public/data/puzzles/[0-9]*\.pz')"
          cp "$APK" chess-academy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chess-academy-debug-apk
          path: chess-academy.apk

      - name: Publish as the "apk-latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest chess-academy.apk \
            --prerelease \
            --title "Latest test build (debug APK)" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. For testing only; not signed for the Play Store."
